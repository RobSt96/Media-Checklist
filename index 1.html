<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sunday Media" />
  <title>Sunday Media</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235e6ad2'/%3E%3Cpath d='M20 33l8 8 16-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Apply saved / system theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sundayMedia:theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>

  <!-- ============ Sticky header ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Sunday Media</h1>
        <div class="brand-sub">
          <span id="clock" class="clock" aria-label="Current time">--:--:--</span>
          <span id="sync" class="sync" data-state="local" title="Sync status"><i></i><span>Local</span></span>
        </div>
      </div>

      <div class="actions">
        <button id="btn-undo" class="icon-btn" type="button" aria-label="Undo last change" title="Undo last change" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" type="button" aria-label="Toggle dark / light theme" title="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="btn-reset" class="pill-btn" type="button" aria-label="Reset for Next Sunday" title="Reset for Next Sunday">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <button id="btn-lock" class="icon-btn" type="button" aria-label="Unlock edit mode" title="Edit mode / Settings">
          <svg class="i-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <svg class="i-gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- Edit-mode banner (shown only when unlocked) -->
    <div id="edit-banner" class="edit-banner" hidden>
      <div class="edit-banner-inner">
        <span class="edit-dot"></span>
        <span class="edit-label">Edit mode</span>
        <button id="btn-settings" class="link-btn" type="button">Settings</button>
        <button id="btn-exit-edit" class="link-btn strong" type="button">Exit Edit Mode</button>
      </div>
    </div>
  </header>

  <!-- ============ Main view (rendered by app.js) ============ -->
  <main id="view" class="view" aria-live="polite">
    <div class="loading">Loading…</div>
  </main>

  <!-- ============ Bottom navigation ============ -->
  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar-inner">
      <button class="tab" type="button" data-action="tab" data-tab="setup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
        <span>Setup</span><b class="tab-count" data-count="setup"></b>
      </button>
      <button class="tab" type="button" data-action="tab" data-tab="service">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>
        <span>Main Service</span><b class="tab-count" data-count="service"></b>
      </button>
      <button class="tab" type="button" data-action="tab" data-tab="setdown">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
        <span>Set Down</span><b class="tab-count" data-count="setdown"></b>
      </button>
      <button class="tab" type="button" data-action="tab" data-tab="faq">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span>FAQ</span>
      </button>
    </div>
  </nav>

  <!-- ============ Undo / status toast ============ -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="toast-btn" type="button">Undo</button>
    <i class="toast-bar"></i>
  </div>

  <!-- ============ Bottom sheet (FAQ viewer, editors, settings) ============ -->
  <div id="sheet-layer" class="layer" hidden>
    <div class="scrim" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Details">
      <div class="grabber" data-close aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <!-- ============ Centered dialog (confirm, PIN) ============ -->
  <div id="dialog-layer" class="layer dialog-layer" hidden>
    <div class="scrim"></div>
    <div id="dialog-body" class="dialog" role="alertdialog" aria-modal="true"></div>
  </div>

  <!-- ============ Image lightbox ============ -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Close image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img id="lightbox-img" alt="Reference image" />
  </div>

  <noscript><p class="noscript">Sunday Media needs JavaScript enabled.</p></noscript>
</body>
</html>
